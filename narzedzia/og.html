<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="robots" content="noindex" />
    <title>Źródło grafiki OG (1200 × 630)</title>
    <!--
      Z tej strony powstaje assets/og/lucid-academy.jpg (podgląd linku w mediach
      społecznościowych). Po zmianie: otwórz ją przez lokalny serwer w oknie
      1200 × 630, zrób zrzut i zapisz jako JPEG poniżej 300 KB.
    -->
    <link rel="stylesheet" href="../css/strona.css" />
    <style>
      html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
      .og { position: relative; width: 1200px; height: 630px; }

      .og__ilustracja {
        position: absolute;
        top: 50%;
        right: -190px;
        width: 820px;
        transform: translateY(-50%);
        -webkit-mask-image: radial-gradient(closest-side, #000 48%, transparent);
                mask-image: radial-gradient(closest-side, #000 48%, transparent);
      }

      .og__tresc {
        position: absolute;
        inset: 64px auto 60px 72px;
        display: flex;
        flex-direction: column;
        width: 600px;
      }
      .og__logo { --skala: .72; }

      .og__tytul {
        margin-top: auto;
        color: var(--ink);
        font: 800 60px/.98 var(--display);
        letter-spacing: -.025em;
        text-wrap: balance;
      }

      .og__adres {
        margin-top: 30px;
        color: var(--muted);
        font: 400 24px/1 var(--mono);
      }
    </style>
  </head>
  <body>
    <div class="og">
      <div class="tlo" aria-hidden="true">
        <div class="tlo__niebo"></div>
        <div class="tlo__siatka"></div>
        <div class="tlo__skan"></div>
      </div>

      <img class="og__ilustracja" src="../assets/art/laser-education.webp" alt="" width="1536" height="1024" />

      <div class="og__tresc">
        <span class="logo og__logo"><img src="../assets/logo-nav.webp" alt="Lucid Academy" width="478" height="156" /></span>
        <p class="og__tytul">
          <span class="slowo-klucz__tekst">Szkolenia</span> z&nbsp;AI dla instytucji publicznych, samorządów, szkół i&nbsp;NGO.
        </p>
        <p class="og__adres"><span class="etykieta__znak">&gt;</span> lucidacademy.pl</p>
      </div>
    </div>
  </body>
</html>
