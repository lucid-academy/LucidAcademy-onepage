    otworzArkusz(w.tytul, html, naWstecz);

    var przycisk = $('do-planu');
    przycisk.addEventListener('click', function () {
      if (wPlanie(w.id)) delete stan.plan[w.id]; else stan.plan[w.id] = true;
      zapiszPlan();
      przycisk.setAttribute('aria-pressed', wPlanie(w.id) ? 'true' : 'false');
      przycisk.querySelector('span').textContent = wPlanie(w.id) ? 'W moim planie' : 'Dodaj do planu';
      odswiezPiny(); odswiezTrase(); odswiezPasek();
    });

    Array.prototype.forEach.call(tresc.querySelectorAll('[data-zdjecie]'), function (b) {
      b.addEventListener('click', function () {
        otworzLupe(b.getAttribute('data-zdjecie'), w.tytul, w.zdjecia);
      });
    });
    podepnijNawigacje();

    if (l && l.gps) { var p = zGps(l.gps.lat, l.gps.lng); pokazPunkt(p[0], p[1], 3); }
  }

  function podepnijNawigacje() { /* zwykłe linki — nic do podpinania, zostawione dla czytelności */ }

  /* ═══════════════ widok: program ═══════════════ */

  /* Program w sekcjach po nurtach.

     Na Chełmińskim jeden wykaz zlewa dwie zupełnie różne rzeczy: piętnaście
     punktów sceny, które mają godziny i po kolei mijają, oraz trzydzieści dwa
     stoiska, które stoją otwarte cały czas. Wrzucone razem dawały ścianę
     jednakowych „12:00–15:00”, w której nie dało się znaleźć ani jednego,
     ani drugiego. Nurt niesie też własny opis, więc sekcja od razu tłumaczy,
     czym jest — na przykład że godziny sceny są orientacyjne. */
  function programWSekcjach(lista) {
    var kolejnosc = (DANE.nurty || []).map(function (n) { return n.id; });
    var wgNurtu = {};
    lista.forEach(function (w) {
      var id = nurtem(w);
      (wgNurtu[id] = wgNurtu[id] || []).push(w);
    });
    // Nurty nieznane danym (albo wydarzenia bez nurtu) idą na koniec, nie giną.
    Object.keys(wgNurtu).forEach(function (id) {
      if (kolejnosc.indexOf(id) === -1) kolejnosc.push(id);
    });

    var html = '';
    kolejnosc.forEach(function (id) {
      var grupa = wgNurtu[id];
      if (!grupa || !grupa.length) return;
      var n = NURTY[id] || {};
      /* Sekcja bez godzin jest numerowana, więc porządkuje ją numer, a nie zegar.
         Sortowanie po czasie wypychało wieżę ciśnień (wejście 12:15) na sam koniec,
         za stoisko 33 — w wykazie, który poza tym biegnie 1, 2, 3… */
      if (n.bezGodzin) {
        grupa = grupa.slice().sort(function (a, b) {
          var la = LOKALIZACJE[a.lokalizacja] || {}, lb = LOKALIZACJE[b.lokalizacja] || {};
          var na = la.numer == null ? 1e9 : la.numer, nb = lb.numer == null ? 1e9 : lb.numer;
          return na - nb;
        });
      }
      html += '<div class="nurt-sekcja">' +
        '<h3>' + bezpiecznie(n.nazwa || 'Pozostałe') +
          '<span>' + grupa.length + '</span></h3>' +
        (n.opis ? '<p>' + bezpiecznie(n.opis) + '</p>' : '') +
        '</div>' +
        listaWydarzen(grupa, false, { numerZamiastGodzin: !!n.bezGodzin, bezZnakuNurtu: true });
    });
    return html;
  }

  function pokazProgram() {
    stan.widok = 'program'; stan.widokArg = null;
    var lista = posortowane(DANE.wydarzenia.filter(pasuje));
    var html = lista.length
      ? (DANE.swieto.programWgNurtow ? programWSekcjach(lista) : listaWydarzen(lista, false))
      : '<p class="pusto">Żadne wydarzenie nie pasuje do wybranych filtrów.<br>Spróbuj odznaczyć któryś.</p>';
    // Kredyt organizatora — z danych, nie z kodu. Miejsce na mapie zajmuje
    // atrybucja podkładu, wymagana licencją, więc ten idzie tutaj.
    if (DANE.swieto.stopka) {
      html += '<p class="pusto" style="border-top:1px solid var(--kreska);margin-top:1rem;font-size:.78rem">' +
        bezpiecznie(DANE.swieto.stopka) + '</p>';
    }
    otworzArkusz('Program — ' + lista.length + zOdmiana(lista.length, ' wydarzenie', ' wydarzenia', ' wydarzeń'), html);
    podepnijListe();
  }

  function zOdmiana(n, jeden, kilka, wiele) {
    if (n === 1) return jeden;
    var r10 = n % 10, r100 = n % 100;
    if (r10 >= 2 && r10 <= 4 && (r100 < 12 || r100 > 14)) return kilka;
    return wiele;
  }

  /* ═══════════════ widok: plan ═══════════════ */

  function pokazPlan() {
    stan.widok = 'plan'; stan.widokArg = null;
    var wybrane = posortowane(DANE.wydarzenia.filter(function (w) { return wPlanie(w.id); }));

    if (!wybrane.length) {
      otworzArkusz('Mój plan',
        '<p class="pusto">Nie masz jeszcze nic w planie.<br>' +
        'Otwórz wydarzenie i naciśnij „Dodaj do planu”, a ułożę je po godzinach ' +
        'i policzę, ile zajmie przejście między nimi.</p>' +
        '<div class="dzialania"><button type="button" class="przycisk" id="do-kreatora">' +
        ikona(IKONY_UI.plan) + 'Zaplanuj za mnie</button></div>' +
        '<p class="przypis" style="text-align:center">Powiesz, którego dnia masz czas i czego szukasz — ' +
        'ułożę propozycję, która mieści się w Twoim oknie razem z przejściami.</p>');
      $('do-kreatora').addEventListener('click', pokazKreator);
      return;
    }

    var html = '', poprzedni = null, ostrzezen = 0;
    wybrane.forEach(function (w) {
      var l = LOKALIZACJE[w.lokalizacja];
      var d = DNI[w.dzien];

      if (!poprzedni || poprzedni.dzien !== w.dzien) {
        html += '<div class="dzien-naglowek">' + bezpiecznie(d.nazwa) + ' ' + d.data.split('-').reverse().join('.') + '</div>';
      } else {
        var lp = LOKALIZACJE[poprzedni.lokalizacja];
        if (lp && l && lp.id !== l.id && lp.gps && l.gps) {
          var p = przejscie(lp.gps, l.gps);
          // Ile realnie zostaje: od końca poprzedniego (albo jego startu,
          // gdy program nie podaje końca) do startu następnego.
          /* Dwa różne kłopoty, które łatwo pomylić:
             — wydarzenie trwa długo i po prostu trzeba z niego wyjść wcześniej
               (to normalne przy imprezach, na które się „wpada"),
             — nie da się zdążyć, nawet wychodząc od razu (to dopiero alarm).
             Mierzenie tylko od godziny zakończenia dawałoby czerwone
             ostrzeżenie przy każdym całodniowym punkcie programu. */
          var startPoprzedniego = naMinuty(poprzedni.od);
          var koniecPoprzedniego = naMinuty(poprzedni.do || poprzedni.od);
          var start = naMinuty(w.od);
          var koniecNastepnego = w.do ? naMinuty(w.do) : start;
          var przybycieNajwczesniej = startPoprzedniego + p.minuty;   // gdybyś wyszedł od razu
          var najpozniejWyjsc = start - p.minuty;                     // żeby zdążyć na początek

          var zaciasno = przybycieNajwczesniej > koniecNastepnego;    // nie da się w ogóle
          var spoznisz = !zaciasno && przybycieNajwczesniej > start;  // złapiesz, ale nie od początku
          var trzebaWczesniej = !zaciasno && !spoznisz && najpozniejWyjsc < koniecPoprzedniego;
          if (zaciasno) ostrzezen++;

          var powod = '';
          if (zaciasno) {
            powod = ' — nie zdążysz; wydarzenie kończy się o ' + zMinut(koniecNastepnego) +
              ', a najwcześniej byłbyś o ' + zMinut(przybycieNajwczesniej);
          } else if (spoznisz) {
            powod = ' — na początek nie zdążysz, najwcześniej o ' + zMinut(przybycieNajwczesniej) +
              (w.do ? ' (trwa do ' + w.do + ')' : '');
          } else if (trzebaWczesniej) {
            powod = ' — wyjdź najpóźniej o ' + zMinut(najpozniejWyjsc) +
              (poprzedni.do ? ', przed końcem poprzedniego wydarzenia' : '');
          }
          if (!poprzedni.do && powod) {
            powod += '. Program nie podaje, kiedy kończy się poprzednie wydarzenie';
          }
          html += '<div class="przejscie' + (zaciasno ? ' zaciasno' : '') + '">' + ikona(IKONY_UI.nogi) +
            '<span>' + p.minuty + ' min pieszo (' +
            (p.metry >= 1000 ? (p.metry / 1000).toFixed(1) + ' km' : p.metry + ' m') + ')' + powod +
            '</span></div>';
        } else if (lp && l && lp.id === l.id) {
          html += '<div class="przejscie"><span>To samo miejsce — nigdzie nie idziesz.</span></div>';
        }
      }

      html += '<div class="plan-poz">' +
        '<span class="godz">' + bezpiecznie(godziny(w)) + '</span>' +
        '<span class="tyt">' + bezpiecznie(w.tytul) + '</span>' +
        '<span class="msc">' + bezpiecznie(w.miejsce) + '</span>' +
        '<button type="button" class="usun" data-usun="' + bezpiecznie(w.id) + '">Usuń z planu</button>' +
        '</div>';
      poprzedni = w;
    });

    if (ostrzezen) {
      html = '<p class="brak-opisu" style="border-left-color:var(--ostrzezenie)">' +
        'W ' + ostrzezen + zOdmiana(ostrzezen, ' miejscu' , ' miejscach', ' miejscach') +
        ' nie zdążysz między wydarzeniami, nawet wychodząc od razu. Zaznaczone na czerwono.</p>' + html;
    }

    html += '<div class="dzialania"><button type="button" class="przycisk pusty" id="do-kreatora">' +
      ikona(IKONY_UI.plan) + 'Ułóż plan od nowa</button></div>';

    otworzArkusz('Mój plan — ' + wybrane.length + zOdmiana(wybrane.length, ' pozycja', ' pozycje', ' pozycji'), html);

    $('do-kreatora').addEventListener('click', pokazKreator);
    Array.prototype.forEach.call(tresc.querySelectorAll('[data-usun]'), function (b) {
      b.addEventListener('click', function () {
        delete stan.plan[b.getAttribute('data-usun')];
        zapiszPlan(); odswiezPiny(); odswiezTrase(); pokazPlan();
      });
    });
  }

  /* ═══════════════ widok: zaplanuj święto ═══════════════ */

  /* Kreator układa propozycję, nie wyrocznię: dobiera wydarzenia, które
     mieszczą się w oknie godzinowym RAZEM z czasem przejścia między nimi.
     Wynik trafia do „Mojego planu" dopiero po zatwierdzeniu i dalej daje
     się edytować ręcznie. */

  var kreator = null;   // zapamiętane ustawienia, żeby powrót nie kasował formularza

  function domyslneKreatora() {
    var dzien = stan.dzien !== 'wszystkie' ? stan.dzien : DANE.swieto.dni[0].id;
    return { dzien: dzien, od: null, do: null, tagi: {}, kategorie: {}, pobyt: 45 };
  }

  /** Widełki godzin całego dnia — stąd biorą się wartości początkowe. */
  function zakresDnia(dzien) {
    var lista = DANE.wydarzenia.filter(function (w) { return w.dzien === dzien; });
    if (!lista.length) return { od: 600, do: 1200 };
    var od = Math.min.apply(null, lista.map(function (w) { return naMinuty(w.od); }));
    var doo = Math.max.apply(null, lista.map(function (w) { return naMinuty(w.do || w.od); }));
    return { od: od, do: doo };
  }

  function pokazKreator() {
    stan.widok = 'kreator'; stan.widokArg = null;
    if (!kreator) kreator = domyslneKreatora();
    var zakres = zakresDnia(kreator.dzien);
    if (kreator.od === null) kreator.od = zakres.od;
    if (kreator.do === null) kreator.do = zakres.do;

    // Ile wydarzeń tego dnia niesie dany tag/kategorię — pokazujemy wprost,
    // żeby nikt nie szukał w ciemno tam, gdzie program milczy.
    var tegoDnia = DANE.wydarzenia.filter(function (w) { return w.dzien === kreator.dzien; });
    function ile(pred) { return tegoDnia.filter(pred).length; }

    var html = '<div class="pole"><h3>Dzień</h3><div class="filtry">';
    DANE.swieto.dni.forEach(function (d) {
      html += '<button type="button" class="filtr" data-kdzien="' + bezpiecznie(d.id) + '" aria-pressed="' +
        (kreator.dzien === d.id ? 'true' : 'false') + '">' + bezpiecznie(d.nazwa) + ' ' +
        (+d.data.split('-')[2]) + '.' + d.data.split('-')[1] + '</button>';
    });
    html += '</div></div>';

    html += '<div class="pole"><h3>Mam czas</h3><div class="godziny">' +
      '<input type="time" id="k-od" value="' + zMinut2(kreator.od) + '" aria-label="Od godziny">' +
      '<span>–</span>' +
      '<input type="time" id="k-do" value="' + zMinut2(kreator.do) + '" aria-label="Do godziny">' +
      '</div></div>';

    html += '<div class="pole"><h3>Szukam czegoś</h3><div class="filtry">';
    DANE.kategorie.forEach(function (kt) {
      var n = ile(function (w) { return w.kategoria === kt.id; });
      html += '<button type="button" class="filtr" data-kkat="' + bezpiecznie(kt.id) + '" style="--kolor:' +
        bezpiecznie(kt.kolor) + '" aria-pressed="' + (kreator.kategorie[kt.id] ? 'true' : 'false') + '"' +
        (n ? '' : ' disabled') + '><span class="plamka"></span>' + bezpiecznie(kt.nazwa) +
        ' <span class="licznik-opcji">' + n + '</span></button>';
    });
    html += '</div></div>';

    html += '<div class="pole"><h3>Warunki</h3><div class="filtry">';
    DANE.tagi.forEach(function (t) {
      var n = ile(function (w) { return w.tagi.indexOf(t.id) !== -1; });
      html += '<button type="button" class="filtr" data-ktag="' + bezpiecznie(t.id) + '" aria-pressed="' +
        (kreator.tagi[t.id] ? 'true' : 'false') + '"' + (n ? '' : ' disabled') +
        (t.opis ? ' title="' + bezpiecznie(t.opis) + '"' : '') + '>' + bezpiecznie(t.nazwa) +
        ' <span class="licznik-opcji">' + n + '</span></button>';
    });
    html += '</div><p class="przypis">Liczby mówią, ile wydarzeń tego dnia ma dany znacznik. ' +
      'Tam, gdzie program milczy, znacznika nie ma — to nie znaczy, że wydarzenie nie pasuje.</p></div>';

    html += '<div class="pole"><h3>Ile chcę zostać w jednym miejscu</h3><div class="pobyt">' +
      '<input type="number" id="k-pobyt" min="10" max="180" step="5" value="' + kreator.pobyt + '" aria-label="Minut w jednym miejscu">' +
      '<span>minut</span></div>' +
      '<p class="przypis">To Twoje założenie, nie dane organizatorów. Dziesięć wydarzeń nie ma podanej ' +
      'godziny zakończenia — dla nich liczymy tyle właśnie minut.</p></div>';

    html += '<div class="dzialania"><button type="button" class="przycisk" id="k-uloz">Ułóż propozycję</button></div>';

    otworzArkusz('Zaplanuj święto', html, function () { pokazPlan(); });

    Array.prototype.forEach.call(tresc.querySelectorAll('[data-kdzien]'), function (b) {
      b.addEventListener('click', function () {
        kreator.dzien = b.getAttribute('data-kdzien');
        var z = zakresDnia(kreator.dzien);
        kreator.od = z.od; kreator.do = z.do;      // nowy dzień, nowe widełki
        pokazKreator();
      });
    });
    Array.prototype.forEach.call(tresc.querySelectorAll('[data-kkat],[data-ktag]'), function (b) {
      b.addEventListener('click', function () {
        var kat = b.getAttribute('data-kkat'), tag = b.getAttribute('data-ktag');
        var zbior = kat ? kreator.kategorie : kreator.tagi, klucz = kat || tag;
        if (zbior[klucz]) delete zbior[klucz]; else zbior[klucz] = true;
        b.setAttribute('aria-pressed', zbior[klucz] ? 'true' : 'false');
      });
    });
    $('k-uloz').addEventListener('click', function () {
      var podaneOd = naMinuty($('k-od').value), podaneDo = naMinuty($('k-do').value);
      if (podaneOd !== null) kreator.od = podaneOd;
      if (podaneDo !== null && podaneDo > kreator.od) kreator.do = podaneDo;
      kreator.pobyt = Math.max(10, Math.min(180, +$('k-pobyt').value || 45));
      pokazPropozycje();
    });
  }

  function zMinut2(m) {
    var g = Math.floor(m / 60), n = m % 60;
    return (g < 10 ? '0' : '') + g + ':' + (n < 10 ? '0' : '') + n;
  }

  /** Dobiera wydarzenia mieszczące się w oknie razem z czasem przejścia. */
  function ulozPropozycje(o) {
    var kandydaci = DANE.wydarzenia.filter(function (w) {
      if (w.dzien !== o.dzien) return false;
      var wybraneKat = Object.keys(o.kategorie);
      if (wybraneKat.length && wybraneKat.indexOf(w.kategoria) === -1) return false;
      var wybraneTagi = Object.keys(o.tagi);
      for (var i = 0; i < wybraneTagi.length; i++) if (w.tagi.indexOf(wybraneTagi[i]) === -1) return false;
      var start = naMinuty(w.od);
      var koniec = w.do ? naMinuty(w.do) : start + o.pobyt;
      return koniec > o.od && start < o.do;                 // zahacza o okno
    }).sort(function (a, b) { return naMinuty(a.od) - naMinuty(b.od); });

    var wybrane = [], czas = o.od, gdzie = null, skadId = null;
    kandydaci.forEach(function (w) {
      var l = LOKALIZACJE[w.lokalizacja];
      if (!l || !l.gps) return;
      // Kolejne wydarzenie w tym samym miejscu nie wymaga marszu.
      var dojscie = (gdzie && skadId !== l.id) ? przejscie(gdzie, l.gps).minuty : 0;
      var start = Math.max(czas + dojscie, naMinuty(w.od));
      var koniecW = w.do ? naMinuty(w.do) : naMinuty(w.od) + o.pobyt;
      var koniec = Math.min(koniecW, o.do);
      // Chcemy `pobyt` minut, ale wydarzenie krótsze wystarczy w całości.
      var potrzeba = Math.min(o.pobyt, koniecW - naMinuty(w.od));
      if (koniec - start < potrzeba) return;
      // Zostajemy tyle, ile chcieliśmy — nie tyle, ile wydarzenie trwa.
      var zostaje = Math.min(o.pobyt, koniec - start);
      wybrane.push({ w: w, start: start, pobyt: zostaje, dojscie: dojscie });
      czas = start + zostaje;
      gdzie = l.gps; skadId = l.id;
    });
    return { wybrane: wybrane, kandydatow: kandydaci.length };
  }

  function pokazPropozycje() {
    stan.widok = 'propozycja'; stan.widokArg = null;
    var wynik = ulozPropozycje(kreator);
    var d = DNI[kreator.dzien];

    if (!wynik.wybrane.length) {
      otworzArkusz('Propozycja planu',
        '<p class="pusto">W oknie ' + zMinut2(kreator.od) + '–' + zMinut2(kreator.do) + ' nic się nie mieści.<br>' +
        (wynik.kandydatow
          ? 'Pasujących wydarzeń jest ' + wynik.kandydatow + ', ale nie da się do nich zdążyć pieszo. Spróbuj poszerzyć okno albo skrócić czas pobytu.'
          : 'Żadne wydarzenie tego dnia nie ma wybranych znaczników. Spróbuj odznaczyć któryś.') + '</p>',
        function () { pokazKreator(); });
      return;
    }

    var html = '<p class="przypis" style="margin-bottom:.8rem">' + bezpiecznie(d.nazwa) + ', ' +
      zMinut2(kreator.od) + '–' + zMinut2(kreator.do) + '. Zmieściło się ' + wynik.wybrane.length +
      ' z ' + wynik.kandydatow + zOdmiana(wynik.kandydatow, ' pasującego wydarzenia', ' pasujących wydarzeń', ' pasujących wydarzeń') +
      '. To propozycja — po wpisaniu do planu możesz ją dowolnie zmieniać.</p>';

    wynik.wybrane.forEach(function (poz, i) {
      if (i > 0 && poz.dojscie > 0) {
        html += '<div class="przejscie">' + ikona(IKONY_UI.nogi) + '<span>' + poz.dojscie + ' min pieszo</span></div>';
      }
      html += '<div class="propozycja">' +
        '<span class="godz">' + zMinut2(poz.start) + '</span>' +
        '<span class="tyt">' + bezpiecznie(poz.w.tytul) + '</span>' +
        '<span class="msc">' + bezpiecznie(poz.w.miejsce) + ' · zostajesz ' + poz.pobyt + ' min</span>' +
        '</div>';
    });

    html += '<div class="dzialania">' +
      '<button type="button" class="przycisk" id="k-wpisz">Wpisz do mojego planu</button>' +
      '<button type="button" class="przycisk pusty" id="k-wroc">Zmień ustawienia</button></div>';

    otworzArkusz('Propozycja planu', html, function () { pokazKreator(); });

    $('k-wroc').addEventListener('click', pokazKreator);
    $('k-wpisz').addEventListener('click', function () {
      // Podmieniamy tylko ten dzień — ręczne wybory z drugiego dnia zostają.
      DANE.wydarzenia.forEach(function (w) { if (w.dzien === kreator.dzien) delete stan.plan[w.id]; });
      wynik.wybrane.forEach(function (poz) { stan.plan[poz.w.id] = true; });
      zapiszPlan();
      stan.dzien = kreator.dzien;
      Array.prototype.forEach.call($('dni').children, function (x, i) {
        x.setAttribute('aria-pressed', DANE.swieto.dni[i] && DANE.swieto.dni[i].id === kreator.dzien ? 'true' : 'false');
      });
      poFiltrach();
      pokazPlan();
    });
  }

  /* ═══════════════ widok: filtry ═══════════════ */

  function pokazFiltry() {
    stan.widok = 'filtry'; stan.widokArg = null;
    var html = '';

    // Filtr nurtu tylko wtedy, gdy jest z czego wybierać.
    if ((DANE.nurty || []).length > 1) {
      html += '<div class="grupa-filtrow"><h3>Które święto</h3><div class="filtry">';
      DANE.nurty.forEach(function (n) {
        html += '<button type="button" class="filtr" data-nurt="' + bezpiecznie(n.id) + '" ' +
          'aria-pressed="' + (stan.nurty[n.id] ? 'true' : 'false') + '">' + bezpiecznie(n.nazwa) + '</button>';
      });
      html += '</div></div>';
    }

    html += '<div class="grupa-filtrow"><h3>Kategoria</h3><div class="filtry">';
    DANE.kategorie.forEach(function (kt) {
      html += '<button type="button" class="filtr" data-kat="' + bezpiecznie(kt.id) + '" style="--kolor:' + bezpiecznie(kt.kolor) + '" ' +
        'aria-pressed="' + (stan.kategorie[kt.id] ? 'true' : 'false') + '">' +
        '<span class="plamka"></span>' + bezpiecznie(kt.nazwa) + '</button>';
    });
    html += '</div></div>';

    if (DANE.tagi && DANE.tagi.length) {
      html += '<div class="grupa-filtrow"><h3>Tagi — łączone przez „oraz”</h3><div class="filtry">';
      DANE.tagi.forEach(function (t) {
        html += '<button type="button" class="filtr" data-tag="' + bezpiecznie(t.id) + '" ' +
          'aria-pressed="' + (stan.tagi[t.id] ? 'true' : 'false') + '"' +
          (t.opis ? ' title="' + bezpiecznie(t.opis) + '"' : '') + '>' + bezpiecznie(t.nazwa) + '</button>';
      });
      html += '</div></div>';
      html += '<p class="pusto" style="padding:.3rem 0;text-align:left">Brak tagu przy wydarzeniu znaczy „nie wiemy”, nie „nie dotyczy”.</p>';
    }

    html += '<div class="dzialania"><button type="button" class="przycisk pusty" id="wyczysc">Wyczyść filtry</button></div>';
    otworzArkusz('Filtry', html);

    Array.prototype.forEach.call(tresc.querySelectorAll('[data-kat],[data-tag],[data-nurt]'), function (b) {
      b.addEventListener('click', function () {
        var kat = b.getAttribute('data-kat'), tag = b.getAttribute('data-tag'), nurt = b.getAttribute('data-nurt');
        var zbior = kat ? stan.kategorie : (tag ? stan.tagi : stan.nurty), klucz = kat || tag || nurt;
        if (zbior[klucz]) delete zbior[klucz]; else zbior[klucz] = true;
        b.setAttribute('aria-pressed', zbior[klucz] ? 'true' : 'false');
        poFiltrach();
      });
    });
    $('wyczysc').addEventListener('click', function () {
      stan.kategorie = {}; stan.tagi = {}; stan.nurty = {};
      poFiltrach(); pokazFiltry();
    });
  }

  function poFiltrach() { odswiezPiny(); odswiezTrase(); odswiezPasek(); rysuj(); }

  /* ═══════════════ widok: przyjaciele święta ═══════════════

     Osobno od programu, bo to nie są wydarzenia. Znaczniki na mapie
     pojawiają się tylko przy otwartej sekcji i wyglądają inaczej niż piny,
     żeby nikt nie wziął ich za punkt programu. */

  function pokazPrzyjaciol() {
    stan.widok = 'przyjaciele'; stan.widokArg = null;
    var p = DANE.przyjaciele || {};
    var lista = p.lista || [];

    var html = p.wstep ? '<p class="pusto" style="text-align:left;padding:0 0 .7rem">' + bezpiecznie(p.wstep) + '</p>' : '';

    html += lista.length ? lista.map(function (x, i) {
      var wiersze = '';
      if (x.adres) wiersze += '<p class="msc">' + bezpiecznie(x.adres) + '</p>';
      if (x.pomoc) wiersze += '<p class="pomoc">' + bezpiecznie(x.pomoc) + '</p>';
      if (x.otwarte) wiersze += '<p class="pomoc">' + bezpiecznie(x.otwarte) + '</p>';
      if (x.url) wiersze += '<p><a href="' + bezpiecznie(x.url) + '" target="_blank" rel="noopener">strona ↗</a></p>';
      return '<div class="przyjaciel">' +
        '<span class="znaczek-serca" aria-hidden="true">' + ikona(IKONY_UI.serce) + '</span>' +
        '<div><h3>' + bezpiecznie(x.nazwa) + '</h3>' + wiersze + '</div>' +
        (x.gps ? '<button type="button" class="pokaz-na-mapie" data-przyjaciel="' + i + '">Pokaż</button>' : '') +
        '</div>';
    }).join('') : '<p class="pusto">Lista jeszcze pusta.</p>';

    otworzArkusz('Przyjaciele Święta', html);
    znacznikiPrzyjaciol(true);

    Array.prototype.forEach.call(tresc.querySelectorAll('[data-przyjaciel]'), function (b) {
      b.addEventListener('click', function () {
        var x = lista[+b.getAttribute('data-przyjaciel')];
        if (!x || !x.gps) return;
        var poz = zGps(x.gps.lat, x.gps.lng);
        pokazPunkt(poz[0], poz[1], 3.5);
      });
    });
  }

  /* ═══════════════ widok: pamięć ═══════════════

     Dorobek dziewięciu edycji: magnesy i pocztówki. To jedyne miejsce na tej
     stronie, które nie służy dzisiejszemu dniu — pokazuje, że święto ma swoją
     ciągłość, i tłumaczy, skąd biorą się rysunki widoczne na stoiskach 6 i 10.

     Bez `DANE.pamiec` zakładka w ogóle się nie pojawia. */

  function kafelki(pozycje, wszystkiePliki) {
    return '<div class="pamiec-siatka">' + pozycje.map(function (x, i) {
      var mini = x.plik.replace(/(\.\w+)$/, '-mini$1');
      var etykieta = x.etykieta || '';
      return '<button type="button" class="pamiec-kafel" data-pamiec="' + i + '">' +
        '<img src="' + bezpiecznie(mini) + '" alt="' + bezpiecznie(etykieta || 'pamiątka') + '" loading="lazy">' +
        (etykieta ? '<span>' + bezpiecznie(etykieta) + '</span>' : '') +
        '</button>';
    }).join('') + '</div>';
  }

  function pokazPamiec() {
    var p = DANE.pamiec;
    if (!p) return;
    stan.widok = 'pamiec'; stan.widokArg = null;

    var magnesy = (p.magnesy || []).filter(function (m) { return m.plik; }).map(function (m) {
      var lata = m.rok ? String(m.rok) : (m.edycja ? m.edycja + ' Święto' : '');
      return { plik: m.plik, etykieta: lata, opis: m.opis, tytul: m.tytul, edycja: m.edycja, rok: m.rok };
    });
    var pocztowki = (p.pocztowki || []).filter(function (x) { return x.plik; }).map(function (x) {
      return { plik: x.plik, etykieta: '', opis: null, tytul: x.tytul, autor: x.autor };
    });

    var html = (p.wstep ? '<p class="pamiec-wstep">' + bezpiecznie(p.wstep) + '</p>' : '');

    if (magnesy.length) {
      html += '<div class="nurt-sekcja"><h3>Magnesy<span>' + magnesy.length + '</span></h3></div>' +
        kafelki(magnesy) +
        '<ul class="pamiec-opisy">' + magnesy.map(function (m) {
          var glowa = (m.edycja ? m.edycja + ' Święto' : '') + (m.rok ? ' · ' + m.rok : '');
          var reszta = [m.tytul, m.opis].filter(Boolean).join(' — ');
          return reszta ? '<li><b>' + bezpiecznie(glowa) + '</b> ' + bezpiecznie(reszta) + '</li>' : '';
        }).join('') + '</ul>';
    }

    if (pocztowki.length) {
      html += '<div class="nurt-sekcja"><h3>Pocztówki<span>' + pocztowki.length + '</span></h3>' +
        (p.pocztowkiOpis ? '<p>' + bezpiecznie(p.pocztowkiOpis) + '</p>' : '') + '</div>' +
        kafelki(pocztowki);
      var autor = pocztowki[0] && pocztowki[0].autor;
      if (autor) html += '<p class="przypis">Rysunki: ' + bezpiecznie(autor) +
        '. Tytuły są na oryginałach dopisane ołówkiem i częściowo nieczytelne — nie zgadujemy ich.</p>';
    }

    if (p.zgoda) html += '<p class="przypis">' + bezpiecznie(p.zgoda) + '</p>';

    otworzArkusz(p.naglowek || 'Pamięć Chełmionki', html);

    // Podpięcie po wstawieniu treści: każda grupa przewija się osobno w lupie.
    var grupy = [magnesy, pocztowki];
    var siatki = tresc.querySelectorAll('.pamiec-siatka');
    Array.prototype.forEach.call(siatki, function (siatka, nr) {
      var grupa = grupy[nr] || [];
      var pliki = grupa.map(function (x) { return x.plik; });
      Array.prototype.forEach.call(siatka.querySelectorAll('[data-pamiec]'), function (b) {
        b.addEventListener('click', function () {
          var i = Number(b.getAttribute('data-pamiec'));
          var x = grupa[i] || {};
          var podpis = [x.etykieta, x.tytul, x.opis].filter(Boolean).join(' — ');
          otworzLupe(pliki[i], podpis || 'Pamiątka ze święta', pliki);
        });
      });
    });
  }

  /* ═══════════════ widok: o nas ═══════════════ */

  function pokazONas() {
    stan.widok = 'onas'; stan.widokArg = null;
    var o = DANE.onas || {};
    var html = '';

    if (o.logo) html += '<img id="onas-logo" src="' + bezpiecznie(o.logo) + '" alt="Logo " loading="lazy">';
    if (o.tresc) html += '<div class="opis">' + bezpiecznie(o.tresc) + '</div>';

    var k = o.kontakt;
    if (k && k.email) {
      if (k.wstep) html += '<p class="pomoc" style="margin-top:1rem">' + bezpiecznie(k.wstep) + '</p>';
      var adres = 'mailto:' + encodeURIComponent(k.email).replace(/%40/, '@') +
        (k.temat ? '?subject=' + encodeURIComponent(k.temat) : '');
      html += '<div class="dzialania">' +
        '<a class="przycisk" href="' + bezpiecznie(adres) + '">' + ikona(IKONY_UI.koperta) +
        bezpiecznie(k.etykieta || 'Napisz do nas') + '</a>' +
        (o.formularz ? '<a class="przycisk pusty" href="' + bezpiecznie(o.formularz) +
          '" target="_blank" rel="noopener">Formularz ↗</a>' : '') +
        '</div>';
      html += '<p class="msc" style="text-align:center">' + bezpiecznie(k.email) + '</p>';
    }

    otworzArkusz(o.naglowek || 'O nas', html);
  }

  /* Znaczniki przyjaciół — osobna warstwa, mniejsze i obrysowane,
     widoczne tylko przy otwartej sekcji. */
  var znacznikiP = [];
  function zbudujZnaczniki() {
    var lista = (DANE.przyjaciele && DANE.przyjaciele.lista) || [];
    var wezel = $('piny');
    lista.forEach(function (x, i) {
      if (!x.gps) return;
      var poz = zGps(x.gps.lat, x.gps.lng);
      /* Klikalne, nie ozdobne: znacznik, który ignoruje dotknięcie, drażni
         bardziej niż pomaga. Prowadzi do swojego wpisu na otwartej liście. */
      var e = document.createElement('button');
      e.type = 'button';
      e.className = 'znacznik-przyjaciela';
      e.title = x.nazwa;
      e.setAttribute('aria-label', 'Przyjaciel Święta: ' + x.nazwa);
      e.innerHTML = ikona(IKONY_UI.serce);
      e.hidden = true;
      e.addEventListener('click', function () { wskazPrzyjaciela(i); });
      wezel.appendChild(e);
      znacznikiP.push({ wezel: e, dane: x, indeks: i, x: poz[0], y: poz[1] });
    });
  }

  function przeliczZnaczniki() {
    znacznikiP.forEach(function (z) {
      var poz = zGps(z.dane.gps.lat, z.dane.gps.lng);
      z.x = poz[0]; z.y = poz[1];
    });
  }

  function znacznikiPrzyjaciol(widoczne) {
    znacznikiP.forEach(function (z) { z.wezel.hidden = !widoczne; });
    if (widoczne) rysuj();
  }

  /** Z mapy do wpisu na liście — przewija i na chwilę podświetla. */
  function wskazPrzyjaciela(indeks) {
    var wpisy = tresc.querySelectorAll('.przyjaciel');
    var cel = wpisy[indeks];
    if (!cel) return;
    Array.prototype.forEach.call(wpisy, function (w) { w.classList.remove('wskazany'); });
    cel.classList.add('wskazany');
    cel.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    setTimeout(function () { cel.classList.remove('wskazany'); }, 2200);
  }

  /* ═══════════════ podgląd zdjęcia ═══════════════ */

  /* Galeria: raz otwarte zdjęcie przewija się w obrębie wydarzenia —
     strzałkami, klawiszami i przesunięciem palca — bez wracania do panelu. */
  var lupa = $('lupa'), galeria = [], wGalerii = 0, podpisGalerii = '';

  function pokazZdjecie(i) {
    if (!galeria.length) return;
    wGalerii = (i + galeria.length) % galeria.length;      // zawija się w kółko
    /* Nazwa bez rozszerzenia znaczy zdjęcie wydarzenia z img/. Pozycja z kropką
       jest już gotową ścieżką — tak trafiają tu magnesy i pocztówki, które leżą
       w podkatalogach i są WebP-ami. */
    var poz = galeria[wGalerii];
    $('lupa-obraz').src = /\.\w+$/.test(poz) ? poz : 'img/' + poz + '.jpg';
    $('lupa-obraz').alt = 'Zdjęcie ' + (wGalerii + 1) + ' z ' + galeria.length + ': ' + podpisGalerii;
    $('lupa-podpis').innerHTML = bezpiecznie(podpisGalerii) +
      (galeria.length > 1 ? '<br><span class="licznik-zdjec">' + (wGalerii + 1) + ' z ' + galeria.length + '</span>' : '');
    var jedno = galeria.length < 2;
    $('lupa-wstecz').hidden = jedno;
    $('lupa-dalej').hidden = jedno;
  }

  function otworzLupe(nazwa, podpis, wszystkie) {
    galeria = (wszystkie && wszystkie.length) ? wszystkie.slice() : [nazwa];
    podpisGalerii = podpis;
    pokazZdjecie(Math.max(0, galeria.indexOf(nazwa)));
    lupa.hidden = false;
    $('zamknij-lupe').focus();
  }

  function zamknijLupe() { lupa.hidden = true; $('lupa-obraz').src = ''; galeria = []; }

  $('zamknij-lupe').addEventListener('click', zamknijLupe);
  $('lupa-wstecz').addEventListener('click', function () { pokazZdjecie(wGalerii - 1); });
  $('lupa-dalej').addEventListener('click', function () { pokazZdjecie(wGalerii + 1); });
  lupa.addEventListener('click', function (e) { if (e.target === lupa) zamknijLupe(); });

  document.addEventListener('keydown', function (e) {
    if (lupa.hidden) return;
    if (e.key === 'ArrowLeft')  { e.preventDefault(); pokazZdjecie(wGalerii - 1); }
    if (e.key === 'ArrowRight') { e.preventDefault(); pokazZdjecie(wGalerii + 1); }
  });

  // Przesunięcie palcem — na telefonie naturalniejsze niż celowanie w strzałkę.
  var dotykX = null;
  lupa.addEventListener('pointerdown', function (e) { dotykX = e.clientX; });
  lupa.addEventListener('pointerup', function (e) {
    if (dotykX === null) return;
    var przesuw = e.clientX - dotykX;
    dotykX = null;
    if (Math.abs(przesuw) > 45) pokazZdjecie(wGalerii + (przesuw < 0 ? 1 : -1));
  });

  /* ═══════════════ dolny pasek ═══════════════ */

  var SEKCJE = [
    { id: 'program', nazwa: 'Program',  ikona: IKONY_UI.program, otworz: pokazProgram },
    PLANER ? { id: 'plan', nazwa: 'Mój plan', ikona: IKONY_UI.plan, otworz: pokazPlan, licznik: ilePlanu } : null,
    { id: 'filtry',  nazwa: 'Filtry',   ikona: IKONY_UI.filtry,  otworz: pokazFiltry, licznik: function () { return ileWybrano(stan.kategorie) + ileWybrano(stan.tagi) + ileWybrano(stan.nurty); } },
    DANE.pamiec ? { id: 'pamiec', nazwa: 'Pamięć', ikona: IKONY.paleta, otworz: pokazPamiec } : null,
    { id: 'przyjaciele', nazwa: 'Przyjaciele', ikona: IKONY_UI.serce, otworz: pokazPrzyjaciol },
    { id: 'onas',        nazwa: 'O nas',       ikona: IKONY_UI.koperta, otworz: pokazONas }
  ].filter(Boolean);

  (function zbudujPasek() {
    var pasek = $('pasek');
    SEKCJE.forEach(function (s) {
      var b = document.createElement('button');
      b.type = 'button';
      b.id = 'sekcja-' + s.id;
      b.setAttribute('aria-expanded', 'false');
      b.innerHTML = ikona(s.ikona) + '<span>' + s.nazwa + '</span>';
      b.addEventListener('click', function () {
        if (stan.widok === s.id) { zamknijArkusz(); return; }   // drugie naciśnięcie zamyka
        s.otworz();
      });
      pasek.appendChild(b);
    });
  })();

  function odswiezPasek() {
    SEKCJE.forEach(function (s) {
      var b = $('sekcja-' + s.id);
      b.setAttribute('aria-expanded', stan.widok === s.id ? 'true' : 'false');
      var stary = b.querySelector('.licznik');
      if (stary) stary.remove();
      var n = s.licznik ? s.licznik() : 0;
      if (n > 0) {
        var z = document.createElement('span');
        z.className = 'licznik'; z.textContent = n;
        b.appendChild(z);
      }
    });
  }

  /* ═══════════════ pasek promowanego wydarzenia ═══════════════

     Odliczanie do najbliższego nadchodzącego wydarzenia z polem `promocja`.
     Po jego zakończeniu pasek znika sam, a gdy promowanych jest kilka,
     przeskakuje na następne. Godziny liczymy w czasie lokalnym urządzenia,
     bo taki ma człowiek stojący na Bydgoskim. */

  var KLUCZ_PROMO = 'promo-ukryte:' + (DANE.swieto.id || 'swieto');

  function kiedy(w) {
    var d = DNI[w.dzien];
    if (!d) return null;
    return new Date(d.data + 'T' + w.od + ':00');
  }
  function kiedyKoniec(w) {
    var d = DNI[w.dzien];
    if (!d) return null;
    // Bez godziny zakończenia dajemy wydarzeniu dwie godziny, żeby pasek
    // nie zniknął w sekundzie rozpoczęcia koncertu.
    return w.do ? new Date(d.data + 'T' + w.do + ':00')
                : new Date(kiedy(w).getTime() + 2 * 3600e3);
  }

  function odliczanie(ms) {
    var s = Math.max(0, Math.floor(ms / 1000));
    var dni = Math.floor(s / 86400), godz = Math.floor(s % 86400 / 3600);
    var min = Math.floor(s % 3600 / 60), sek = s % 60;
    if (dni > 0)  return 'za ' + dni + zOdmiana(dni, ' dzień', ' dni', ' dni') + ' ' + godz + ' godz.';
    if (godz > 0) return 'za ' + godz + ' godz. ' + min + ' min';
    if (min > 0)  return 'za ' + min + ' min ' + sek + ' s';
    return 'za ' + sek + ' s';
  }

  /* ═══════════════ zegar sceny ═══════════════

     Święto, które trwa trzy godziny i ma punkt co kwadrans, potrzebuje nie
     odliczania do jednego koncertu, tylko odpowiedzi na pytanie „co jest teraz
     i co za chwilę”. Ktoś stoi w parku o 13:10 i nie będzie przewijał wykazu
     piętnastu pozycji, żeby się zorientować.

     Siedzi w tym samym pasku co zapowiedź, bo to ta sama rola na ekranie —
     jedna linijka nad mapą — i ten sam mechanizm tykania. Włącza je pole
     `swieto.zegarSceny` w danych; bez niego pasek działa jak dotąd. */
  (function zegarSceny() {
    var cfg = DANE.swieto.zegarSceny;
    var pasek = $('promo');
    if (!cfg || !pasek) return;

    var punkty = DANE.wydarzenia
      .filter(function (w) { return nurtem(w) === cfg.nurt && kiedy(w); })
      .sort(function (a, b) { return kiedy(a) - kiedy(b); });
    if (!punkty.length) return;

    $('promo-sluchaj').hidden = true;
    $('promo-zwin').hidden = true;
    var znak = $('promo-znak');
    znak.style.setProperty('--kolor', (KATEGORIE[punkty[0].kategoria] || {}).kolor || 'var(--akcent)');
    znak.innerHTML = ikona(IKONY.nuta);

    var licznik = null, okres = 0;

    /* Ostatni punkt programu nie ma godziny zakończenia, a domyślne dwie godziny
       z `kiedyKoniec` sprawiały, że o 15:30 — pół godziny po święcie — pasek
       dalej ogłaszał „teraz: Uroczyste zakończenie”. Punkt bez `do` dostaje tu
       tyle, ile wynosi rytm tego programu, czyli kwadrans. */
    var DOMYSLNA_DLUGOSC = 15 * 60e3;
    function koniecPunktu(w) {
      return w.do ? kiedyKoniec(w).getTime() : kiedy(w).getTime() + DOMYSLNA_DLUGOSC;
    }

    function tyknij() {
      var teraz = Date.now();
      var trwa = null, nastepne = null;
      for (var i = 0; i < punkty.length; i++) {
        var start = kiedy(punkty[i]).getTime();
        if (start <= teraz && teraz < koniecPunktu(punkty[i])) trwa = punkty[i];
        if (start > teraz && !nastepne) nastepne = punkty[i];
      }

      /* Po ostatnim punkcie pasek znika — zegar, który po święcie dalej coś
         obiecuje, jest gorszy niż jego brak. */
      if (!trwa && !nastepne) { pasek.hidden = true; clearInterval(licznik); return; }

      var doStartu = nastepne ? kiedy(nastepne).getTime() - teraz : 0;
      if (trwa) {
        $('promo-haslo').textContent = cfg.haslo || 'Teraz na scenie';
        $('promo-co').textContent = trwa.tytul;
        $('promo-zegar').textContent = nastepne
          ? 'do ' + trwa.do + ' · potem ' + nastepne.od + ' ' + nastepne.tytul
          : (trwa.do ? 'do ' + trwa.do : 'ostatni punkt programu');
        $('promo-zegar').classList.add('trwa');
        $('promo-tresc').onclick = function () { pokazWydarzenie(trwa.id); };
      } else {
        $('promo-haslo').textContent = cfg.hasloPrzed || 'Scena główna zaczyna';
        $('promo-co').textContent = nastepne.tytul;
        $('promo-zegar').textContent = odliczanie(doStartu) + ' · ' + nastepne.od;
        $('promo-zegar').classList.remove('trwa');
        $('promo-tresc').onclick = function () { pokazWydarzenie(nastepne.id); };
      }
      pasek.hidden = false;

      // Sekundy tykają dopiero na finiszu; wcześniej wystarcza pół minuty.
      var chciany = (doStartu > 3600e3) ? 30000 : 1000;
      if (okres !== chciany) {
        clearInterval(licznik);
        licznik = setInterval(tyknij, chciany);
        okres = chciany;
      }
    }
    tyknij();
  })();

  (function pasekPromo() {
    var pasek = $('promo');
    if (!pasek || DANE.swieto.zegarSceny) return;   // zegar sceny zajął ten pasek
    try { if (localStorage.getItem(KLUCZ_PROMO) === 'tak') return; } catch (e) {}

    var promowane = DANE.wydarzenia.filter(function (w) { return w.promocja && kiedy(w); });
    if (!promowane.length) return;

    var licznik = null, okresLicznika = 0, biezace = null;

    function wybierz() {
      var teraz = Date.now();
      var czynne = promowane.filter(function (w) { return kiedyKoniec(w).getTime() > teraz; })
        .sort(function (a, b) { return kiedy(a) - kiedy(b); });
      return czynne[0] || null;
    }

    function pokaz(w) {
      var kat = KATEGORIE[w.kategoria] || {};
      var p = w.promocja;
      $('promo-znak').style.setProperty('--kolor', kat.kolor || 'var(--akcent)');
      $('promo-znak').innerHTML = p.ikona
        ? '<img src="' + bezpiecznie(p.ikona) + '" alt="">'
        : ikona(IKONY[kat.ikona] || IKONY.punkt);
      $('promo-haslo').textContent = p.haslo || 'Nie przegap';
      $('promo-co').textContent = w.tytul.replace(/\s+—\s+koncert$/, '');
      if (p.url) {
        $('promo-sluchaj').href = p.url;
        $('promo-etykieta').textContent = p.etykietaLinku || 'Posłuchaj';
        $('promo-sluchaj').hidden = false;
      } else {
        $('promo-sluchaj').hidden = true;
      }
      pasek.hidden = false;
    }

    function tyknij() {
      var w = wybierz();
      if (!w) { pasek.hidden = true; clearInterval(licznik); return; }
      if (w !== biezace) { biezace = w; pokaz(w); }

      var doStartu = kiedy(w).getTime() - Date.now();
      var zegar = $('promo-zegar');
      if (doStartu <= 0) {
        zegar.textContent = 'trwa teraz — ' + w.miejsce;
        zegar.classList.add('trwa');
      } else {
        var d = DNI[w.dzien];
        var skrotDnia = d.nazwa.toLowerCase().slice(0, 3) + '.';
        zegar.textContent = odliczanie(doStartu) + ' · ' + skrotDnia + ' ' + w.od;
        zegar.classList.remove('trwa');
      }
      // Sekundy tykają tylko na finiszu — dalej wystarcza pół minuty.
      var chcianyOkres = doStartu > 3600e3 ? 30000 : 1000;
      if (okresLicznika !== chcianyOkres) {
        clearInterval(licznik);
        licznik = setInterval(tyknij, chcianyOkres);
        okresLicznika = chcianyOkres;
      }
    }

    $('promo-tresc').addEventListener('click', function () {
      if (biezace) pokazWydarzenie(biezace.id, function () { zamknijArkusz(); });
    });
    $('promo-zwin').addEventListener('click', function () {
      pasek.hidden = true;
      clearInterval(licznik);
      try { localStorage.setItem(KLUCZ_PROMO, 'tak'); } catch (e) {}
    });

    tyknij();
  })();

  /* ═══════════════ przełącznik dni ═══════════════ */

  (function zbudujDni() {
    var pojemnik = $('dni');
    /* Jednodniowe święto nie ma czego przełączać. Chełmińskie trwa trzy godziny
       w jedną niedzielę, a pasek i tak pokazywał „Oba dni" — czyli pytanie
       bez sensu, zajmujące pasmo na górze ekranu. */
    if (DANE.swieto.dni.length < 2) { pojemnik.hidden = true; return; }

    var opcje = DANE.swieto.dni.map(function (d) {
      return { id: d.id, etykieta: d.nazwa + ' ' + (+d.data.split('-')[2]) + '.' + d.data.split('-')[1] };
    });
    opcje.push({ id: 'wszystkie', etykieta: DANE.swieto.dni.length === 2 ? 'Oba dni' : 'Wszystkie dni' });

    opcje.forEach(function (o) {
      var b = document.createElement('button');
      b.type = 'button';
      b.textContent = o.etykieta;
      b.setAttribute('aria-pressed', stan.dzien === o.id ? 'true' : 'false');
      b.addEventListener('click', function () {
        stan.dzien = o.id;
        Array.prototype.forEach.call(pojemnik.children, function (x) {
          x.setAttribute('aria-pressed', x === b ? 'true' : 'false');
        });
        poFiltrach();
        if (stan.widok === 'program') pokazProgram();
        else if (stan.widok === 'plan') pokazPlan();
      });
      pojemnik.appendChild(b);
    });
  })();

  /* ═══════════════ licznik odsłon ═══════════════

     Jedyny obcy skrypt na tej stronie i jedyny, bez którego wszystko
     działa tak samo. Ładuje się wyłącznie na domenie produkcyjnej,
     odroczony, a jego awaria jest bez znaczenia — nie ma tu żadnego
     `await` ani niczego, co by na niego czekało. */
  (function licznik() {
    var l = DANE.swieto.licznik;
    if (!l || !l.kod || !l.domeny) return;
    if (location.protocol !== 'https:') return;
    /* `domeny` to lista, nie pojedynczy wpis. Gdy nazwa hosta się nie zgadza,
       licznik milczy bez śladu w konsoli — to awaria, której nie widać.
       Lista obejmuje wariant z `www` i przetrwa przeprowadzkę na inną domenę. */
    if (l.domeny.indexOf(location.hostname) === -1) return;

    var s = document.createElement('script');
    s.async = true;
    s.setAttribute('data-goatcounter', l.kod);
    s.src = 'https://gc.zgo.at/count.js';
    s.onerror = function () { /* brak licznika nikomu nie szkodzi */ };
    document.body.appendChild(s);

    if (l.nota) {
      var p = $('atrybucja');
      if (p) p.insertAdjacentHTML('beforeend', ' · ' + bezpiecznie(l.nota));
    }
  })();

  /* ═══════════════ start ═══════════════ */

  var s = DANE.swieto;

  /* Paleta z danych nadpisuje domyślną. Barwy Bydgoskiego wyszły ze zdjęć
     tamtej dzielnicy i nie ma powodu, żeby Chełmińskie je dziedziczyło —
     ma własny plakat i własne pocztówki. Kod nie zna żadnej z tych palet,
     tylko wpisuje to, co dostał. */
  if (s.paleta) {
    for (var zmienna in s.paleta) {
      if (Object.prototype.hasOwnProperty.call(s.paleta, zmienna)) {
        document.documentElement.style.setProperty('--' + zmienna, s.paleta[zmienna]);
      }
    }
  }

  $('tytul').textContent = s.nazwa;
  document.title = s.nazwa;
  /* Przy jednodniowym święcie pod tytułem ma stać termin, nie dzielnica.
     Kto otwiera mapę Chełmionki, wie, że jest na Chełmińskim — nie musi
     natomiast wiedzieć, że rzecz trwa trzy godziny i kończy się o 15. */
  var MIESIACE = ['stycznia', 'lutego', 'marca', 'kwietnia', 'maja', 'czerwca',
                  'lipca', 'sierpnia', 'września', 'października', 'listopada', 'grudnia'];
  function terminSkrotem() {
    if (!s.dni || s.dni.length !== 1) return null;
    var d = s.dni[0], cz = d.data.split('-');
    return d.nazwa + ' ' + (+cz[2]) + ' ' + MIESIACE[+cz[1] - 1] +
           (s.godziny ? ', ' + s.godziny.replace('-', '–') : '');
  }
  $('podtytul').textContent = terminSkrotem() || (s.dzielnica + ', ' + s.miasto);

  /** Prostokąt obejmujący piny, w jednostkach płótna. Null, gdy pinów nie ma.
      Punkty z `pozaKadrem` nie liczą się do kadru: wieża ciśnień stoi 57 m za
      ostatnim namiotem i sama rozciągałaby widok o połowę, zostawiając na górze
      pas pustej zieleni. Do niej i tak dojeżdża się przewijaniem. */
  function ramkaPinow() {
    var brane = piny.filter(function (p) { return !p.lok.pozaKadrem; });
    if (!brane.length) brane = piny;
    if (!brane.length) return null;
    var minX = Infinity, minY = Infinity, maksX = -Infinity, maksY = -Infinity;
    brane.forEach(function (p) {
      if (p.x < minX) minX = p.x;
      if (p.x > maksX) maksX = p.x;
      if (p.y < minY) minY = p.y;
      if (p.y > maksY) maksY = p.y;
    });
    return { x: minX, y: minY, w: Math.max(1, maksX - minX), h: Math.max(1, maksY - minY) };
  }

  function przelicz(pierwszy) {
    var poprzednie = kDopasowane;
    dopasuj();
    // Przy 'auto' zmiana rozmiaru okna może przechylić szalę na drugą orientację.
    if (wyborOrientacji === 'auto') {
      var chciana = skalaPrzy(true) >= skalaPrzy(false);
      if (chciana !== OBROT) { zastosujOrientacje(chciana, !pierwszy); return; }
    }
    if (pierwszy) {
      /* Domyślnie kadrujemy całe płótno. Ale gdy święto zajmuje ułamek wycinka —
         na Chełmińskim stoiska mieszczą się w 67 x 73 m wewnątrz kadru 147 x 154 —
         otwieranie na całości robi z pinów jedną plamę w środku ekranu.
         `kadrPoczatkowy: 'lokalizacje'` każe zacząć od tego, co się dzieje,
         a nie od tego, co pobraliśmy. Mapa dalej jest cała, tylko dalej. */
      var ramka = (DANE.swieto.kadrPoczatkowy === 'lokalizacje') && ramkaPinow();
      if (ramka) {
        /* Zapas liczony w pikselach, nie procentem skali: pin ma 44 px i jest
           rysowany wokół swojego punktu, więc mnożnik typu 0,86 zostawiał
           skrajnym pinom za mało miejsca i ucinał je na krawędzi ekranu.
           Tu zapas jest zawsze wielkości pinu, niezależnie od przybliżenia. */
        var zapas = 34;
        k = Math.min((wPx - 2 * zapas) / ramka.w, (hPx - 2 * zapas) / ramka.h);
        k = Math.min(kDopasowane * 9, Math.max(kDopasowane, k));
        tx = wPx / 2 - (ramka.x + ramka.w / 2) * k;
        ty = hPx / 2 - (ramka.y + ramka.h / 2) * k;
      } else {
        k = kDopasowane;
        tx = (wPx - PLOTNO.w * k) / 2;
        ty = (hPx - PLOTNO.h * k) / 2;
      }
    } else if (poprzednie > 0) {
      k *= kDopasowane / poprzednie;
    }
    rysuj();
  }

  // Orientacja musi być znana przed pierwszym rysowaniem geometrii,
  // bo obrót jest wliczony w rzutowanie.
  dopasuj();
  OBROT = najlepszaOrientacja();
  ustawPlotno();
  rysujPodklad();
  nazwyUlic();
  zbudujPiny();
  zbudujZnaczniki();
  odswiezPrzyciskObrotu();

  odswiezPiny();
  odswiezTrase();
  odswiezPasek();
  przelicz(true);
  addEventListener('resize', function () { przelicz(false); });
})();
</script>
</body>
</html>
